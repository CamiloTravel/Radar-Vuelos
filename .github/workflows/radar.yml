name: Radar de vuelos
 
on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas (minuto 17 para evitar horas punta de GitHub)
  workflow_dispatch:          # botón para ejecutarlo a mano
 
permissions:
  contents: write
 
concurrency:
  group: radar-vuelos
  cancel-in-progress: false
 
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
 
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
 
      - name: Instalar dependencias
        run: pip install -r requirements.txt
 
      - name: Buscar vuelos
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py
 
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
 
